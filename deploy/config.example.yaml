# ── Shopify 自动注册系统配置 ──────────────────────────
# 复制为 config.yaml 并填入实际值。
# 密钥优先从飞书 81b55a 表自动加载（config.load_feishu_secrets()）。
# 此文件只保留飞书连接信息和基础设施地址。

adspower:
  api_key: ""               # AdsPower API Key (也可以从飞书表加载)
  base_url: "http://43.155.1.195:50325"  # AdsPower Windows 服务器地址

feishu:
  app_id: ""                # 飞书 App ID
  app_secret: ""            # 飞书 App Secret (优先从 81b55a 表加载)
  sheet_token: ""           # 飞书表格 token (IRFq...)

infra:
  ads_server: "43.155.1.195"       # AdsPower Windows 服务器 IP
  ads_ssh_pass: ""                  # SSH 密码 (优先从 81b55a 表加载)

llm:
  base_url: "http://127.0.0.1:11434/v1"  # BU-30b llama-server (FRP 隧道或本地)
  model: "bu-30b"
  temperature: 0.1
  max_tokens: 8192
  vision_fallback: true
